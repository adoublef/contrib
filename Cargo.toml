[package]
name = "contrib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
async_zip = { version = "0.0.18", features = ["chrono", "deflate", "tokio", "tokio-fs"] }
axum = "0.8.8"
chrono = "0.4.44"
csv-async = { version = "1.3.1", features = ["tokio"] }
dial9-tokio-telemetry = "0.2.0"
futures-macro = "=0.3.32"
futures-util = { version = "0.3.32", features = ["io"] }
html5gum = "0.8.3"
http-body-util = "0.1.3"
http-json-stream = "0.1.2"
maud = { version = "0.27.0", features = ["axum"] }
mime = "0.3.17"
rc-zip-tokio = "4.3.1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "net", "io-util", "fs", "tracing"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io-util"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
trait-variant = "0.1.2"
url = { version = "2.5.8", features = ["serde"] }
